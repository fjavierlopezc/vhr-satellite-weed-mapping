<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 130" width="100%" height="100%">
  <defs>
    <!-- Filtro de Sombra para dar profundidad -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" />
      <feOffset dx="0" dy="2" />
      <feComponentTransfer><feFuncA type="linear" slope="0.08" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Degradados -->
    <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E74B5" />
      <stop offset="100%" stop-color="#1F4E79" />
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2A154" />
      <stop offset="100%" stop-color="#D9742B" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70AD47" />
      <stop offset="100%" stop-color="#548235" />
    </linearGradient>

    <!-- Marcadores de Flechas -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#595959" />
    </marker>
  </defs>

  <!-- Fondo Blanco -->
  <rect width="550" height="130" fill="#FFFFFF" />

  <!-- 1. ENTRADAS -->
  <g filter="url(#shadow)">
    <rect x="15" y="10" width="150" height="110" rx="6" fill="url(#grad-blue)" />
    <rect x="15" y="10" width="150" height="22" rx="6" fill="#1F4E79" opacity="0.8" />
    <text x="90" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. DATOS DE ENTRADA</text>
    <text x="90" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Imágenes satélite VHR</text>
    <text x="90" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Ortomosaico UAV</text>
    <text x="90" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Capa vectorial (rodales)</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <line x1="168" y1="65" x2="195" y2="65" stroke="#595959" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. PREPROCESAMIENTO -->
  <g filter="url(#shadow)">
    <rect x="200" y="10" width="150" height="110" rx="6" fill="url(#grad-orange)" />
    <rect x="200" y="10" width="150" height="22" rx="6" fill="#B35614" opacity="0.8" />
    <text x="275" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. PREPROCESAMIENTO</text>
    <text x="275" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Calibración BOA (DOS1)</text>
    <text x="275" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Coregistro geométrico</text>
    <text x="275" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Pansharpening WV-2 (GS)</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <line x1="353" y1="65" x2="380" y2="65" stroke="#595959" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. ANÁLISIS ESPECTRAL -->
  <g filter="url(#shadow)">
    <rect x="385" y="10" width="150" height="110" rx="6" fill="url(#grad-green)" />
    <rect x="385" y="10" width="150" height="22" rx="6" fill="#548235" opacity="0.8" />
    <text x="460" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. ANÁLISIS (EDA)</text>
    <text x="460" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Filtro por tipo de píxel</text>
    <text x="460" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Cálculo de IV (NDVI, NDRE)</text>
    <text x="460" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Estadística ANOVA / Tukey</text>
  </g>
</svg>
